<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bathyal — Unified Project Management</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="top-nav">
            <div class="brand">
                <div class="logo-icon">
                    <img src="/logo.png" alt="Bathyal logo" class="brand-logo-img">
                </div>
                <span class="brand-title">Bathyal</span>
                <span class="badge-mode" id="mode-badge">Simple Mode</span>
            </div>

            <div class="nav-actions">
                <!-- Accent Color Picker -->
                <div class="palette-picker" id="palette-picker">
                    <span class="palette-dot active" data-palette="indigo" style="background-color: #6366f1;" title="Indigo"></span>
                    <span class="palette-dot" data-palette="ocean" style="background-color: #0ea5e9;" title="Ocean"></span>
                    <span class="palette-dot" data-palette="emerald" style="background-color: #10b981;" title="Emerald"></span>
                    <span class="palette-dot" data-palette="rose" style="background-color: #f43f5e;" title="Rose"></span>
                    <span class="palette-dot" data-palette="amber" style="background-color: #f59e0b;" title="Amber"></span>
                    <span class="palette-dot" data-palette="violet" style="background-color: #8b5cf6;" title="Violet"></span>
                </div>

                <!-- Command Palette Button -->
                <button id="cmd-palette-btn" class="btn btn-secondary btn-sm" title="Open Command Palette (Ctrl+K)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <kbd>Ctrl+K</kbd>
                </button>

                <!-- Keyboard Shortcuts Help -->
                <button id="shortcuts-help-btn" class="btn btn-icon btn-ghost" title="Keyboard Shortcuts (?)">
                    <kbd>?</kbd>
                </button>

                <!-- Theme Toggle Button -->
                <button id="theme-toggle-btn" class="btn btn-icon btn-ghost" title="Toggle Dark/Light Theme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>

                <!-- Mode Toggle Button -->
                <button id="mode-toggle-btn" class="btn btn-secondary">
                    Switch to Enterprise
                </button>

                <!-- User Profile & Settings Menu -->
                <div class="user-menu-wrapper" id="user-menu-container">
                    <button class="user-badge-btn" id="user-menu-btn" title="User Profile">
                        <div class="user-avatar-circle" id="user-avatar-initials">U</div>
                        <span id="user-display-name" style="font-weight: 500;">User</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div class="user-dropdown-menu" id="user-dropdown-menu" style="display: none;">
                        <div style="padding: 0.35rem 0.75rem; font-size: 0.75rem; color: var(--text-muted);" id="user-dropdown-email">user@bathyal.local</div>
                        <div class="user-dropdown-divider"></div>
                        <button class="user-dropdown-item" id="btn-menu-switch-mode">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                            <span>Toggle Mode</span>
                        </button>
                        <button class="user-dropdown-item" id="btn-menu-reset-db">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                            <span>Reset Database (Dev)</span>
                        </button>
                        <div class="user-dropdown-divider"></div>
                        <button class="user-dropdown-item danger-item" id="btn-menu-logout">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                            <span>Sign Out</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <div class="main-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Focus Views (Simple Mode) -->
                <div class="sidebar-section" id="simple-sidebar-views">
                    <div class="sidebar-title">Focus Views</div>
                    <a class="nav-link active" data-view="inbox">
                        <div class="nav-link-left">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
                            <span>Inbox</span>
                        </div>
                    </a>
                    <a class="nav-link" data-view="today">
                        <div class="nav-link-left">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            <span>Today</span>
                        </div>
                    </a>
                    <a class="nav-link" data-view="upcoming">
                        <div class="nav-link-left">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <span>Upcoming</span>
                        </div>
                    </a>
                    <a class="nav-link" data-view="completed">
                        <div class="nav-link-left">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            <span>Completed</span>
                        </div>
                    </a>
                </div>

                <!-- Hierarchy Views (Enterprise Mode) -->
                <div class="sidebar-section" id="enterprise-sidebar-views" style="display: none;">
                    <div class="sidebar-title">Workspaces &amp; Projects</div>
                    <div id="workspace-tree-container" style="display: flex; flex-direction: column; gap: 0.25rem;">
                        <span style="font-size: 0.8rem; color: var(--text-muted);">Loading projects...</span>
                    </div>
                </div>

                <!-- Stack Status -->
                <div class="sidebar-section" style="margin-top: auto;">
                    <div class="sidebar-title">System Status</div>
                    <div style="display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.78rem;">
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-muted);">PHP &amp; DB API</span>
                            <span id="api-status-badge" class="badge-tag" style="color: var(--warning);">Connecting...</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-muted);">AI Microservice</span>
                            <span id="ai-status-badge" class="badge-tag" style="color: var(--warning);">Connecting...</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="content-area">
                <div class="content-header">
                    <div class="view-heading">
                        <h1 class="view-title" id="active-view-title">Inbox</h1>
                        <span class="view-subtitle" id="active-view-subtitle">Zero-friction personal task management and quick capture</span>
                    </div>
                </div>

                <div class="content-body">
                    <!-- View Switcher Tabs -->
                    <div id="view-switcher-mount"></div>

                    <!-- Multi-Condition Filter and Sort Bar -->
                    <div id="filter-bar-mount"></div>

                    <!-- Quick Add Bar Component -->
                    <div id="quick-add-mount"></div>

                    <!-- Dynamic Task View Component (List, Kanban, Table, Gantt, or Docs) -->
                    <div id="task-view-mount"></div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
