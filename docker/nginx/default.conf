server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.html index.php;

    charset utf-8;
    client_max_body_size 50M;

    # Gzip Compression for Vanilla JS/CSS/HTML
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --------------------------------------------------------
    # 1. PYTHON AI MICROSERVICE GATEWAY (/api/v1/ai/*)
    # --------------------------------------------------------
    location ^~ /api/v1/ai/ {
        proxy_pass http://ai:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------
    # 2. PHP RESTful API CORE (/api/v1/*)
    # --------------------------------------------------------
    location ^~ /api/v1/ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    # --------------------------------------------------------
    # 3. DIRECT STATIC ASSETS & UPLOADED DOCUMENTS DISPATCHER
    # --------------------------------------------------------
    location ^~ /uploads/ {
        location ~ \.(php|phtml|phar|sh|py|pl|cgi)$ {
            deny all;
        }
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot|pdf|doc|docx|ppt|pptx|xls|xlsx|csv|txt|zip)$ {
        expires 1d;
        access_log off;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # 4. SINGLE PAGE APPLICATION (SPA) ROUTING & FALLBACK
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
