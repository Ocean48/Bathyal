server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Set maximum upload size
    client_max_body_size 25M;

    # Basic routing: try to serve file directly, fallback to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Cache static assets for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Protect config files from being accessed directly
    location ~ ^/(config\.php|database\.php|\.env|core/database\.php)$ {
        deny all;
    }

    # Deny access to hidden files (like .git, .env, .htaccess)
    location ~ /\. {
        deny all;
    }
}
